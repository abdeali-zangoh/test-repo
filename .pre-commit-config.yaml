# Pre-commit hooks configuration for Zangoh SWE Agent
# Organized by fail-fast principle: fastest checks first, slowest last
# All hooks mirror GitHub CI checks to prevent CI failures

default_language_version:
  python: python3.11

repos:
  # ============================================================================
  # STAGE 1: QUICK SYNTAX & FILE VALIDATION (< 5 seconds)
  # Fast checks that catch basic errors early
  # ============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # File integrity and basic syntax (fastest)
      - id: check-ast
        exclude: "^(\\.venv/|\\./)/"
      - id: check-yaml
        args: [ "--unsafe" ]
      - id: check-json
      - id: check-toml
      - id: check-xml

      # Security and merge conflicts (fast)
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: destroyed-symlinks

      # File formatting (fast)
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [ "--fix=lf" ]
      - id: fix-byte-order-marker

      # Python specific quick checks
      - id: debug-statements
      - id: check-docstring-first

      # Branch protection
      - id: no-commit-to-branch
        args: [ "--branch", "main", "--branch", "develop" ]

  # ============================================================================
  # STAGE 2: FILE SIZE & DEPENDENCY VALIDATION (5-15 seconds)
  # Medium-speed checks for file constraints and dependencies
  # ============================================================================
  - repo: local
    hooks:
      # File size limits (medium speed)
      - id: check-large-files
        name: Ensure no files > 2 MB (respects .gitignore)
        entry: >
          bash -c '
            threshold=$((2 * 1024 * 1024)) # 2MB in bytes
            echo "Checking for files larger than 2MB..."
            oversized=0

            while IFS= read -r file; do
              if [ -f "$file" ]; then
                size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file")
                if [ "$size" -gt "$threshold" ]; then
                  echo "❌ ERROR: File exceeds 50MB: $file ($(du -h "$file" | cut -f1))"
                  oversized=1
                fi
              fi
            done < <(git ls-files)

            if [ "$oversized" -eq 1 ]; then
              echo "👉 Tip: Use .gitignore or Git LFS to manage large files."
              exit 1
            fi

            exit 0'
        language: system
        pass_filenames: false

      # UV validation (repo-local)
      - id: uv-lock-local
        name: Ensure uv.lock is up to date (local)
        entry: bash
        language: system
        args: [ "-c", 'uv lock --check || (echo "Please lock using \"uv lock\"" && exit 1)' ]
        pass_filenames: false
        files: "(pyproject.toml|uv.lock)"

      # Sync dev-requirements with uv.
      - id: development-requirements-sync
        name: Ensure requirements_dev.txt is synced (uv)
        entry: >
          bash -c 'uv export --format=requirements.txt --no-hashes > .tmp_requirements.txt && diff -q requirements_dev.txt .tmp_requirements.txt > /dev/null || (echo "❌ ERROR: requirements_dev.txt is out of sync with pyproject.toml." && echo "👉 Run: uv export --format=requirements.txt --no-hashes > requirements_dev.txt" && rm .tmp_requirements.txt && exit 1) && rm .tmp_requirements.txt'
        language: system
        files: '^(pyproject\.toml|uv\.lock|requirements\.txt)$'
        pass_filenames: false

  # ============================================================================
  # STAGE 3: CODE FORMATTING (10-20 seconds)
  # Auto-formatting tools that fix issues automatically
  # ============================================================================
  - repo: local
    hooks:
      # Python formatting, linting and import sorting with Ruff
      - id: ruff-format-local
        name: Format Python code (Ruff - local)
        entry: bash
        language: system
        types: [python]
        args:
          [
            "-c",
            'uv run ruff format --check --diff "$@" || (uv run ruff format "$@" && exit 1)',
            "--",
          ]
        stages: [ pre-commit ]

  # ============================================================================
  # STAGE 4: LINTING & STATIC ANALYSIS (15-30 seconds)
  # Code quality checks that don't modify files
  # ============================================================================
  - repo: local
    hooks:
      # Python linting with Ruff
      - id: ruff-lint-local
        name: Lint Python code (Ruff - local)
        entry: uv run ruff
        language: system
        types: [ python ]
        args: [ "check", "--fix", "--exit-non-zero-on-fix" ]
        stages: [ pre-commit ]

      # Python Type Checking (MyPy - Match CI)
      - id: mypy-local
        name: Type check Python code (MyPy - local)
        entry: uv run mypy
        language: system
        files: "^src/"
        types: [ python ]
        pass_filenames: false
        args: [ --show-error-codes, --pretty, --color-output, --incremental, src ]
        stages: [ pre-commit ]

  # ============================================================================
  # STAGE 5: DOCUMENTATION & STYLE VALIDATION (10-25 seconds)
  # Documentation and style guide enforcement
  # ============================================================================
  - repo: https://github.com/PyCQA/pydocstyle
    rev: 6.3.0
    hooks:
    - id: pydocstyle
      name: Check Python docstrings
      args: [ "--convention=google", "--add-ignore=D100,D101,D102,D103,D104,D105,D106,D107,D202" ]
      files: "^(src|packages)/"

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.33.0
    hooks:
    - id: yamllint
      name: Lint YAML files
      args: [ "-d", "{extends: relaxed, rules: {line-length: disable, trailing-spaces: disable}}" ]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
    - id: markdownlint
      name: Lint and format Markdown
      args: [ "--fix", "--disable", "MD013" ]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
    - id: shellcheck
      name: Lint shell scripts
      args: [ "-x", "-S", "warning" ]

  # ============================================================================
  # STAGE 6: SECURITY SCANNING (20-45 seconds)
  # Security vulnerability detection
  # ============================================================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: Detect secrets in staged files (Gitleaks)
        entry: bash
        language: system
        args:
          - "-c"
          - |
            # Get staged files that are not deleted (A=added, M=modified, but not D=deleted)
            staged_files=$(git diff --cached --name-only --diff-filter=AM)
            if [ -n "$staged_files" ]; then
              # Process files one by one to avoid command line length limits
              echo "$staged_files" | while read -r file; do
                if [ -f "$file" ]; then
                  gitleaks detect --no-git --no-banner --source="$file" --config=.gitleaks.toml --verbose --redact
                fi
              done
            else
              echo "No staged files to check"
            fi
        pass_filenames: false
        stages: [pre-commit]

      - id: gitleaks
        name: Detect secrets in git history (Gitleaks)
        entry: gitleaks
        args:
          - "detect"
          - "--log-opts=-n12"
          - "--config=.gitleaks.toml"
          - "--verbose"
          - "--redact"
          - "--report-format=json"
          - "--report-path=.gitleaks-report.json"
        stages: [pre-push]

  - repo: local
    hooks:
      # Python Security Scanning (Bandit - matches CI)
      - id: bandit-local
        name: Security scan Python code (Bandit - local)
        entry: uv run bandit
        language: system
        files: ^src/
        types: [ python ]
        args: [ -r, -ll, src/ ]
        pass_filenames: false
        stages: [ pre-commit ]

      # TODO: Remove if alternative found or if not needed (API-ERROR)
      # # Backend dependency vulnerability scan
      # - id: backend-safety-check
      #   name: Scan for vulnerable dependencies (Safety)
      #   entry: >
      #     bash -c '
      #       (uv pip compile requirements.txt;uv export --format=requirements.txt --no-hashes;)\
      #       | uv run safety check --stdin --json \
      #       || (echo "WARNING: Some vulnerabilities found" && exit 1);'
      #   language: system
      #   pass_filenames: false
      #   files: "(requirements.*\\.txt|poetry\\.lock)$"

  # ============================================================================
  # STAGE 7: INFRASTRUCTURE & CONTAINER VALIDATION (15-30 seconds)
  # Docker and infrastructure configuration checks
  # ============================================================================
  - repo: local
    hooks:
      # Dockerfile Linting (matches security-gate.yml container checks)
      - id: hadolint
        name: Lint Dockerfiles
        entry: hadolint/hadolint:v2.12.0 hadolint
        args: [ "--ignore", "DL3008", "--ignore", "DL3009" ]
        language: docker_image
        types: [ file, dockerfile ]

      # Docker Compose validation
      - id: docker-compose-validate
        name: Validate Docker Compose files
        entry: >
          bash -c '
            failed=0
            for f in $(find . -name "docker-compose*.yml" -o -name "docker-compose*.yaml"); do
              echo "🔍 Validating: $f"
              docker compose -f "$f" config -q || failed=1
            done
            exit $failed'
        language: system
        files: "docker-compose.*\\.ya?ml$"
        pass_filenames: false

  # ============================================================================
  # STAGE 8: PROJECT STRUCTURE & COMPLIANCE (10-20 seconds)
  # Project organization and service requirements
  # ============================================================================
  - repo: local
    hooks:
      # Ensure all service_requirements are included in root requirements.txt
      - id: check-included-src-requirements
        name: Ensure all sub-requirements are included in root requirements.txt
        entry: >
          bash -c '
            missing=0
            autofix=""
            for f in $(find src -type f -name requirements.txt); do
              if ! grep -q -- "-r $f" requirements.txt; then
                echo "❌ ERROR: requirements.txt is missing include for: -r $f"
                service=$(basename "$(dirname "$f")")
                autofix="$autofix\n# Marker: $service\n-r $f"
                missing=1
              fi
            done

            if [ "$missing" -eq 1 ]; then
              echo ""
              echo "👉 To fix, run the following command to append missing entries:"
              echo ""
              echo -e "echo -e \"$autofix\" >> requirements.txt"
              exit 1
            fi'
        language: system
        files: '^requirements\.txt$|^src/.*/requirements\.txt$'
        pass_filenames: false

      # Service README validation
      - id: service-docs
        name: Ensure each service has a README.md
        entry: >
          bash -c '
            missing=0
            for dir in src/services/*/; do
              [ "$(basename "$dir")" = "__pycache__" ] && continue
              if [ ! -f "$dir/README.md" ]; then
                echo "❌ ERROR: Missing README.md in $dir"
                missing=1
              fi
            done
            exit $missing'
        language: system
        pass_filenames: false

  # ============================================================================
  # STAGE 9: CODE COMPLEXITY ANALYSIS (15-25 seconds)
  # Code quality metrics and complexity checks
  # ============================================================================
  - repo: local
    hooks:
      # Complexity check with Radon (matches code-quality-gate.yml)
      - id: radon-complexity
        name: Check code complexity (Radon CC > 10)
        entry: bash
        args: [ "-c", "radon cc src/ -s -n C || echo 'No functions with complexity > 10 found'" ]
        language: system
        pass_filenames: false
        always_run: true

  # ============================================================================
  # STAGE 10: COMMIT VALIDATION (5-10 seconds)
  # Commit message and branch validation
  # ============================================================================
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.13.0
    hooks:
    - id: commitizen
      name: Validate commit message format
      stages: [ commit-msg ]

  # ============================================================================
  # STAGE 11: PRE-PUSH ONLY CHECKS (30+ seconds)
  # Expensive checks that only run before push
  # ============================================================================
  - repo: local
    hooks:
      # Test coverage check (matches test-coverage-gate.yml)
      - id: test-coverage
        name: Verify test coverage (75% statements, 70% branches)
        entry: bash -c './scripts/run-ci-test-coverage.sh'
        language: system
        pass_filenames: false
        types: [ python ]
        stages: [ pre-push ]

      # PR size validation (Max 25,000 lines changes allowed)
      - id: validate-pr-size
        name: Check PR size (<25,000 lines)
        entry: >
          bash -c '
            base_branch=$(git merge-base HEAD origin/main);
            total=$(git diff "$base_branch" --numstat | awk "{ add += \$1; del += \$2 } END { print add + del }");
            limit=25000;

            if [ "$total" -gt "$limit" ]; then
              RED="\033[1;31m"
              YELLOW="\033[1;33m"
              RESET="\033[0m"

              echo -e "❌ ${RED}ERROR:${RESET} This feature branch has ${YELLOW}${total}${RESET} changed lines (added + deleted), which exceeds the ${YELLOW}${limit}${RESET}-line limit.";
              echo -e "👉 [Careful ⚠️ ] To bypass this check, run: SKIP=validate-pr-size git push";
              exit 1;
            fi

            echo -e "✅ This feature branch has ${YELLOW}${total}${RESET} changed lines (added + deleted), which is within the limit of ${YELLOW}${limit}${RESET} lines.";'
        language: system
        pass_filenames: false
        stages: [ pre-push ]

  # ============================================================================
  # STAGE 12: AI REVIEW & AUTO-FIX (60-300 seconds)
  # Claude AI review with automatic issue fixing
  # ============================================================================
  - repo: local
    hooks:
      # Claude AI Review with Auto-Fix (Headless Mode)
      # NO LIMITS: Reviews ANY size changes (unlike GitHub which has 10k line limit)
      # Reads FULL documentation and standards (no truncation)
      # Uses Claude Opus 4 for review and Claude Sonnet 4 for auto-fixes
      - id: claude-review
        name: Claude AI review with automatic fixes (headless)
        entry: bash -c 'BASH_DEFAULT_TIMEOUT_MS=300000 ./scripts/claude-review-headless.sh'
        language: system
        pass_filenames: false
        stages: [ pre-commit ]
        always_run: true
        verbose: true
        # Automatically fixes critical issues when found
        # Set CLAUDE_AUTOFIX_DISABLED=true to disable auto-fix
        # No file size limits, no line count limits, no restrictions

        # Optional: Claude review on push (review only, no auto-fix)
      - id: claude-review-push
        name: Claude AI final review before push
        entry: bash -c 'BASH_DEFAULT_TIMEOUT_MS=300000 CLAUDE_AUTOFIX_DISABLED=true ./scripts/claude-review-headless.sh'
        language: system
        pass_filenames: false
        stages: [ pre-push ]
        always_run: true
        verbose: true

# ============================================================================
# GLOBAL CONFIGURATION
# ============================================================================

# Global exclusions (matches CI patterns)
exclude: |
  (?x)(
    ^tests/fixtures/|
    ^node_modules/|
    ^\.?venv/|
    ^build/|
    ^dist/|
    ^.*\.egg-info/|
    ^docs/_build/|
    ^\.git/|
    ^performance-baselines/|
    ^monitoring/grafana/|
    ^monitoring/prometheus/|
    ^.*\.min\.(js|css)$|
    ^.*\.map$|
    ^.*\.pyc$|
    ^__pycache__/
  )

# Configure stages
default_stages: [ pre-commit ]
default_install_hook_types: [ pre-commit, pre-push ]
fail_fast: false # Run all checks to see all issues
minimum_pre_commit_version: 4.0.0
